[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/th"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://qwhacqvkppragsulrkig.supabase.co https://app.cal.com data:; frame-src https://maps.google.com https://www.google.com https://app.cal.com; font-src 'self'; connect-src 'self' https://app.cal.com"
